# Local dev cluster. Free, identical to EKS on camera.
# Control-plane carries host port 80/443 -> container, so ingress-nginx (week 5) works.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tarmac
# ponytail: pinned to k8s 1.32 because this Docker Desktop VM runs cgroup v1,
# which containerd 2.x (k8s >=1.33) dropped. Once the VM is on cgroup v2
# (.wslconfig systemd / Docker Desktop upgrade), unpin and let kind pick latest.
nodes:
  - role: control-plane
    image: kindest/node:v1.32.11
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
    image: kindest/node:v1.32.11
