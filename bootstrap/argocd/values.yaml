# ArgoCD helm values, sized for a 12GB Docker Desktop.
server:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  config:
    # local dev only: show plaintext admin password on first login (week 0-6)
    admin.enabled: "true"

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

controller:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi

redis:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# no SSO locally
dex:
  enabled: false
notifications:
  enabled: false
