name: service-ci

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker Hub image name (e.g. rajvasoya06/my-service)'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ inputs.image-name }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ needs.build.outputs.image-tag }}
          severity: CRITICAL
          exit-code: '1'
          format: table
          ignore-unfixed: true
          trivyignores: .trivyignore
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

  policy-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tarmac-platform/tarmac
          path: tarmac
          sparse-checkout: policies
      - name: Install tools
        run: |
          set -euo pipefail
          KYVERNO_VERSION=v1.13.4
          curl -sSLo kyverno.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          tar -xzf kyverno.tar.gz kyverno
          sudo mv kyverno /usr/local/bin/
          cd /tmp && curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv /tmp/kustomize /usr/local/bin/
      - name: Validate manifests against policies
        run: |
          kustomize build k8s > /tmp/rendered.yaml
          kyverno apply \
            tarmac/policies/require-labels.yaml \
            tarmac/policies/require-non-root.yaml \
            tarmac/policies/require-resource-limits.yaml \
            tarmac/policies/disallow-latest-tag.yaml \
            --resource /tmp/rendered.yaml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, scan, policy-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          cd /tmp && curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv /tmp/kustomize /usr/local/bin/
      - name: Update image tag
        working-directory: k8s
        run: kustomize edit set image "${{ inputs.image-name }}:${{ needs.build.outputs.image-tag }}"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "deploy: ${{ inputs.image-name }}:${{ needs.build.outputs.image-tag }}"
          git push
