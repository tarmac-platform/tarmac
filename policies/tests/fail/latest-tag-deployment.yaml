apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-tag-deployment
  labels:
    cost-center: eng
    team: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad
  template:
    metadata:
      labels:
        app: bad
        cost-center: eng
        team: payments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: nginx:latest
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
