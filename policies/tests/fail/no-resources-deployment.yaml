apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-resources-deployment
  labels:
    cost-center: eng
    team: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad
  template:
    metadata:
      labels:
        app: bad
        cost-center: eng
        team: payments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: nginx:1.25.0
