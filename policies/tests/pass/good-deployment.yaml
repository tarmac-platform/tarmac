apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  labels:
    cost-center: eng
    team: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good
  template:
    metadata:
      labels:
        app: good
        cost-center: eng
        team: payments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: nginx:1.25.0
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
