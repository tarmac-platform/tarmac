apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root containers
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Containers must run as a non-root user (runAsNonRoot: true). A root
      container that gets exploited owns the node.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
              operations:
                - CREATE
                - UPDATE
      validate:
        message: >-
          pods must set `runAsNonRoot: true` in their securityContext.
        pattern:
          spec:
            template:
              spec:
                securityContext:
                  runAsNonRoot: true
