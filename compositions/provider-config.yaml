# AWS auth for Crossplane providers. References a Secret created out-of-band
# (never in git). IRSA replaces this at week 12 on EKS.
# Wave 2: aws.* CRDs only exist after the provider-aws packages install.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-credentials
      key: creds
