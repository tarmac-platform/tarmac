# provider-kubernetes manages only the Namespace and Secret objects emitted by
# the ServiceInfra composition. Keep this narrower than cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tarmac-provider-kubernetes
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-admin
subjects:
  - kind: ServiceAccount
    name: crossplane-contrib-provider-kubernetes-17261e579786
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: tarmac-provider-kubernetes
  apiGroup: rbac.authorization.k8s.io
